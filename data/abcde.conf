# Per-attempt paths are supplied by discipline, not interactive shell startup.
WAVOUTPUTDIR="$DISCIPLINE_ATTEMPT/scratch"
OUTPUTDIR="$DISCIPLINE_ATTEMPT/media"
CDROM="$DISCIPLINE_DRIVE"
OUTPUTTYPE=mp3
LAMEOPTS='--preset insane'
CDROMREADERSYNTAX=cdparanoia
CDPARANOIA=cdparanoia
CDPARANOIAOPTS='--never-skip=40'
CDDISCID=cd-discid
MUSICBRAINZ=discipline-musicbrainz
ID3SYNTAX=eyed3
EYED3OPTS='--non-std-genres'
MP3GAIN=rsgain
MP3GAINOPTS='custom --album --tagmode=i'
OUTPUTFORMAT='${ARTISTFILE}/${YEAR}_-_${ALBUMFILE}/${TRACKNUM}_-_${TRACKFILE}'
VAOUTPUTFORMAT='${ARTISTFILE}/${YEAR}_-_${ALBUMFILE}/${TRACKNUM}_-_${TRACKFILE}'
ONETRACKOUTPUTFORMAT='${ARTISTFILE}-${ALBUMFILE}/${ALBUMFILE}'
VAONETRACKOUTPUTFORMAT='Various-${ALBUMFILE}/${ALBUMFILE}'
mungefilename () { printf '%s\n' "$*" | sed 's/[^A-Za-z0-9._-]/_/g'; }
PADTRACKS=y
EXTRAVERBOSE=1
INTERACTIVE=n
EJECTCD=n
KEEPWAVS=y
CDDBCOPYLOCAL=n
CDDBUSELOCAL=n
NOSUBMIT=y
# Artwork fetching stays disabled until the bounded review pipeline is installed.
ACTIONS=cddb,read,encode,tag,move,replaygain
